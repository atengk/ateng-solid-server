# ==============================================================================
# 工作流：ateng-solid-server 持续集成流水线 (Java 21 - Maven)
# 触发分支：main, dev
# ==============================================================================

name: Java CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-pr-title:
    name: 校验 PR 标题规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: 校验 PR 标题符合 Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  detect-changes:
    name: 探测变更路径
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 分析改动文件类型
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!**/*.md'
              - '!docs/**'
              - '!.gitignore'
              - '!.editorconfig'
              - '!LICENSE'

  test:
    name: 编译与离线单元测试 (Java 21)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code_changed != 'false'
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验脚本与 Hooks 语法
        run: |
          if ls scripts/*.sh >/dev/null 2>&1; then
            bash -n scripts/*.sh
          fi
          if [ -d .githooks ]; then
            HOOK_FILES=$(grep -l '^#!' .githooks/* 2>/dev/null || true)
            if [ -n "$HOOK_FILES" ]; then
              echo "$HOOK_FILES" | xargs -r bash -n
            fi
          fi

      - name: 设置 Java 21 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 运行 Maven 编译与离线测试
        run: |
          if [ -f pom.xml ]; then
            mvn clean test -B -T 1C -nsu
          else
            echo "当前尚处于文档与规范初始化阶段（无 pom.xml），跳过 Maven 编译测试。"
          fi

  all-checks-passed:
    name: 质量门禁终审 (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-pr-title, test]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 汇总校验结果
        run: |
          for res in "${{ needs.validate-pr-title.result }}" "${{ needs.detect-changes.result }}" "${{ needs.test.result }}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "::error::Java CI 质量门禁检查失败！"
              exit 1
            fi
          done
          echo "✅ Java CI 全部门禁检查通过！"

      - name: 生成门禁看板报告
        if: always()
        run: |
          {
            echo "## 🚦 ateng-solid-server CI 门禁报告"
            echo ""
            echo "| 检查项 | 状态 | 说明 |"
            echo "| :--- | :---: | :--- |"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "| **PR 标题规范** | ${{ needs.validate-pr-title.result == 'success' && '✅ 通过' || '❌ 失败' }} | Conventional Commits |"
            fi
            echo "| **变更路径探测** | ${{ needs.detect-changes.result == 'success' && '✅ 通过' || '❌ 异常' }} | 纯文档改动自动短路 |"
            if [ "${{ needs.detect-changes.outputs.code_changed }}" = "false" ]; then
              echo "| **Java 21 测试** | ⚡ 短路直通 | 仅涉及文档改动 |"
            else
              echo "| **Java 21 离线测试** | ${{ needs.test.result == 'success' && '✅ 通过' || '❌ 失败' }} | Maven + H2 离线自洽 |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
