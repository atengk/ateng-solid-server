server:
  port: 8080

spring:
  application:
    name: ateng-solid-server
  profiles:
    active: dev
  config:
    import: "optional:classpath:application-local.yml"
  threads:
    virtual:
      enabled: true
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    enabled: false
    locations:
      - classpath:db/migration/system
    validate-on-migrate: true
    out-of-order: false

ateng:
  boot:
    web:
      enum:
        enabled: true
        # 关闭底座内置默认控制器，交由 system 模块 SysEnumController 接管 /admin/system/enums 路由与 @SaCheckLogin 鉴权
        endpoint-enabled: false
        scan-packages:
          - io.github.atengk.solid
    satoken:
      primary-login-type: admin
      same-token:
        enabled: false
      login-defense:
        enabled: true
      interceptor:
        enabled: true
        check-login: true
        login-type-routes:
          admin:
            - /admin/**
    mybatis-plus:
      data-permission:
        enabled: true
      tenant:
        # 多租户默认关闭（首期极简单租户开箱运行）；开启时同步置 ateng.solid.tenant.enabled=true
        enabled: false
        column: tenant_id
        ignore-tables:
          - sys_tenant
          - sys_tenant_package
          - sys_tenant_package_menu
          - sys_menu
          - sys_dict_type
          - sys_dict_data
          - flyway_schema_history
  solid:
    tenant:
      enabled: false
