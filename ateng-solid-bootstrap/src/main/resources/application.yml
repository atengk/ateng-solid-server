server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/xml
  tomcat:
    uri-encoding: UTF-8
    connection-timeout: 15s
    keep-alive-timeout: 30s
    accept-count: 200
    max-connections: 8192
    max-swallow-size: 2MB
    threads:
      max: 200
      min-spare: 10

spring:
  application:
    name: ateng-solid-server
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    hikari:
      pool-name: ateng-solid-hikari
      auto-commit: true
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1680000
      keepalive-time: 300000
  data:
    redis:
      connect-timeout: 5s
      timeout: 3s
      shutdown-timeout: 100ms
  flyway:
    enabled: false
    locations:
      - classpath:db/migration/system
    validate-on-migrate: true
    out-of-order: false

ateng:
  boot:
    core:
      logging:
        enabled: true
        console:
          enabled: true
      slow-alert:
        enabled: true
        default-threshold: 500ms
        include-args: true
        max-args-length: 1024
    web:
      long-to-string: true
      trusted-proxies: ${SOLID_TRUSTED_PROXIES:}
      trace:
        enabled: true
        header-name: X-Trace-Id
      shutdown:
        enabled: true
        drain-timeout: 10s
        poll-interval: 100ms
        smart-lifecycle-enabled: true
        mvc-endpoint-enabled: false
      slow-request:
        enabled: true
        threshold: 3s
      payload-log:
        enabled: false
      operate-log:
        enabled: true
        default-exclude-params:
          - password
          - passwd
          - pwd
          - oldPassword
          - newPassword
          - confirmPassword
          - secret
          - token
          - accessToken
          - refreshToken
          - authorization
          - phone
          - email
          - adminPassword
          - configValue
      security-headers:
        enabled: true
        content-type-options: true
        frame-options: SAMEORIGIN
        xss-protection: "1; mode=block"
        referrer-policy: strict-origin-when-cross-origin
        remove-server-header: true
      enum:
        enabled: true
        # 关闭底座内置默认控制器，交由 system 模块 SysEnumController 接管 /admin/system/enums 路由与 @SaCheckLogin 鉴权
        endpoint-enabled: false
        scan-packages:
          - io.github.atengk.solid
          - io.github.atengk.boot.core.audit
      ratelimit:
        enabled: true
        key-prefix: "${SOLID_REDIS_KEY_PREFIX:solid:}rate_limit:"
        fail-open: true
      idempotent:
        enabled: true
        key-prefix: "${SOLID_REDIS_KEY_PREFIX:solid:}idempotent:"
        fail-open: true
    async:
      wait-for-tasks-to-complete-on-shutdown: true
      await-termination: 30s
      pools:
        password-hash:
          mode: platform
          core-pool-size: 4
          max-pool-size: 6
          queue-capacity: 1000
          wait-for-tasks-to-complete-on-shutdown: true
          await-termination: 30s
    redis:
      key-prefix: ${SOLID_REDIS_KEY_PREFIX:solid:}
      redisson:
        ping-connection-interval: 30s
        retry-attempts: 3
        retry-interval: 1500ms
        lock-watchdog-timeout: 30s
      two-level:
        enabled: true
        l1:
          default-max-size: 5000
          default-ttl: 5m
          max-sizes:
            "[satoken:permissions]": 5000
            dict: 2000
            config: 5000
          ttls:
            "[satoken:permissions]": 5m
            dict: 5m
            config: 5m
        l2:
          default-ttl: 30m
          cache-null-values: true
          null-ttl: 5m
          jitter-enabled: true
          max-jitter: 60s
          ttls:
            "[satoken:permissions]": 30m
    satoken:
      primary-login-type: admin
      super-admin-roles:
        - super_admin
      token:
        timeout: 24h
        active-timeout: 30m
        is-concurrent: true
        is-share: false
        token-style: uuid
      permission-cache:
        tenant-scoped: true
      same-token:
        enabled: false
      login-defense:
        enabled: true
      tenant:
        header-name: X-Tenant-Id
        allow-anonymous-header: false
        allow-super-admin-switch: true
        platform-tenant-ids:
          - "0"
      interceptor:
        enabled: true
        check-login: true
        login-type-routes:
          admin:
            - /admin/**
    mybatis-plus:
      block-attack:
        enabled: true
      pagination:
        enabled: true
        max-limit: 500
        overflow: false
      slow-sql:
        enabled: true
        threshold: 1s
        format-sql: true
        mask-sensitive: true
      data-permission:
        enabled: true
        failure-strategy: DENY_ALL
      tenant:
        # 多租户默认关闭（首期极简单租户开箱运行）；开启时同步置 ateng.solid.tenant.enabled=true
        enabled: false
        column: tenant_id
        ignore-tables:
          - sys_tenant
          - sys_tenant_package
          - sys_tenant_package_menu
          - sys_menu
          - sys_dict_type
          - sys_dict_data
          - flyway_schema_history
    storage:
      type: s3
      s3:
        path-style: true
        auto-create-bucket: true
      local:
        download-endpoint-enabled: true
        upload-endpoint-enabled: false
        whitelist-presigned-download: true
        whitelist-presigned-upload: false
      guard:
        enabled: true
        strict-magic-check: true
        allowed-extensions:
          - jpg
          - jpeg
          - png
          - webp
        max-file-size: 2MB
  solid:
    tenant:
      enabled: false
      status-cache-ttl: 60s
    auth:
      captcha-enabled: true
    init:
      enabled: true
      super-admin-username: superadmin
      super-admin-nickname: 超级管理员
    data-scope:
      max-dept-in-size: 1000
    user:
      import-max-rows: 500
      max-concurrent-imports: 2
      import-feedback-ttl: 15m
    cache:
      dict-ttl: 30m
      config-ttl: 30m

logging:
  charset:
    console: UTF-8
    file: UTF-8
